<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랜덤 친구 번호 뽑기</title>
<style>
:root{--bg:#fff4dc;--card:#ffffff;--ink:#2d2a3e;--sub:#6b6785;--accent:#ff6b6b;--accent2:#4d96ff;--ok:#2fb67c;--line:#eadfc8;--chip:#fff0f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1b2b;--card:#2a2740;--ink:#f4f1ff;--sub:#b3aed1;--line:#3c3860;--chip:#3a2d45}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1b2b;--card:#2a2740;--ink:#f4f1ff;--sub:#b3aed1;--line:#3c3860;--chip:#3a2d45}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:520px}
h1{text-align:center;font-size:26px;margin:8px 0 4px}
.sub{text-align:center;color:var(--sub);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 6px 0 var(--line)}
.hidden{display:none!important}
label{display:block;font-size:17px;margin-bottom:8px}
input[type=number],input[type=password],input[type=text],textarea{width:100%;font-size:26px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
textarea{font-size:13px;text-align:left;height:90px}
input.small{font-size:18px}
button{font-family:inherit;font-size:20px;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;color:#fff;background:var(--accent2);width:100%;margin-top:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.red{background:var(--accent)}
button.green{background:var(--ok)}
button.ghost{background:transparent;color:var(--sub);box-shadow:none;border:2px solid var(--line);font-size:16px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px}.row button{margin-top:12px}
.hi{text-align:center;font-size:22px;margin:0 0 8px}
.slot{font-size:96px;line-height:1.1;text-align:center;font-weight:700;color:var(--accent);margin:14px 0;min-height:110px}
.msg{text-align:center;font-size:17px;color:var(--sub);margin:6px 0}
.msg.big{color:var(--ink);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:6px 14px;font-size:16px}
.chip small{color:var(--sub)}
.err{color:var(--accent);text-align:center;min-height:22px;margin:8px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.scroll{overflow-x:auto;max-height:300px;overflow-y:auto}
.top{display:flex;justify-content:flex-end}
.top button{width:auto;margin:0;padding:6px 12px;font-size:14px}
h2{font-size:18px;margin:0 0 10px}
.mission{background:var(--chip);border:2px dashed var(--accent);border-radius:16px;padding:14px;text-align:center;font-size:19px;margin-top:10px;line-height:1.5}
.mission b{display:block;color:var(--accent);margin-bottom:4px;font-size:16px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#ff6b6b,#ffa94d);color:#fff;text-align:center;overflow-y:auto}
.overlay.hidden{display:none!important}
details.pn{border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px;background:var(--bg)}
details.pn summary{cursor:pointer;font-size:17px;font-weight:700}
details.pn table{margin-top:8px}
#nameGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:340px;overflow-y:auto;margin-top:10px}
.nrow{display:flex;align-items:center;gap:6px;margin:0}
.nrow span{width:30px;text-align:right;font-weight:700}
.nrow input{font-size:16px;padding:8px;text-align:left}
.ov-in{width:100%;max-width:520px}
.ov-title{font-size:30px;margin:0 0 6px}
.ov-who{font-size:22px;margin:0 0 22px;opacity:.95}
.ov-text{font-size:34px;line-height:1.45;font-weight:700;background:rgba(255,255,255,.2);border:3px dashed #fff;border-radius:24px;padding:28px 20px;margin:0 0 26px;word-break:keep-all}
.overlay button{background:#fff;color:#e8590c;font-size:24px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.overlay .pop{animation:pop .5s ease}
.ov-proof{font-size:22px;line-height:1.5;background:rgba(0,0,0,.18);border-radius:18px;padding:16px;margin:-10px 0 24px}
.mi{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--bg);line-height:1.4}
.mi b{font-size:17px}
.mi small{display:block;color:var(--sub);margin-top:4px;font-size:14px}
.ov-snack{font-size:26px;font-weight:700;background:#fff;color:#e8590c;border-radius:18px;padding:14px;margin:0 0 24px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 랜덤 친구 뽑기</h1>
  <p class="sub">하루에 한 번, 새로운 친구를 만나요!</p>

  <!-- 1. 번호 입력 -->
  <div id="vLogin" class="card">
    <label for="myNum">내 번호를 입력하세요</label>
    <input id="myNum" type="number" inputmode="numeric" min="1" placeholder="예: 7">
    <div id="skipNote" class="msg"></div>
    <div id="loginErr" class="err"></div>
    <button id="btnEnter">들어가기</button>
    <button id="btnMissionList" class="ghost">📜 미션 목록 보기</button>
    <button id="btnTeacher" class="ghost">👩‍🏫 선생님 메뉴</button>
  </div>

  <!-- 2. 뽑기 화면 -->
  <div id="vMe" class="hidden">
    <div class="card">
      <p class="hi" id="hi"></p>
      <div class="slot" id="slot">?</div>
      <div id="friendName" style="text-align:center;font-size:28px;font-weight:700;margin-top:-4px"></div>
      <p class="msg big" id="status"></p>
      <div id="mission" class="mission hidden"></div>
      <p class="msg" id="weekNote"></p>
      <button id="btnDraw" class="red">🎁 친구 뽑기!</button>
      <button id="btnBack" class="ghost">처음으로</button>
      <button id="btnMissionList2" class="ghost">📜 미션 목록 보기</button>
    </div>
    <div class="card">
      <h2>📒 내가 뽑은 친구들</h2>
      <div id="history" class="chips"></div>
    </div>
  </div>

  <!-- 미션 목록 -->
  <div id="vMissions" class="hidden">
    <div class="card">
      <h2>📜 미션 목록</h2>
      <p class="msg" id="mlCount" style="text-align:left"></p>
      <div id="mlList"></div>
      <button id="btnMlBack" class="ghost">돌아가기</button>
    </div>
  </div>

  <!-- 3. 선생님 메뉴 -->
  <div id="vTeacher" class="hidden">
    <div id="tLock" class="card">
      <label for="pin">선생님 비밀번호</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••">
      <div id="pinErr" class="err"></div>
      <button id="btnPin" class="green">열기</button>
      <button class="ghost" data-home>돌아가기</button>
    </div>
    <div id="tOpen" class="hidden">
      <div class="card">
        <h2>📋 오늘의 기록 <span id="todayCount" style="font-size:14px;color:var(--sub)"></span></h2>
        <div id="notYet" class="msg" style="text-align:left"></div>
        <div class="scroll"><table class="tbl" id="tbl"></table></div>
      </div>
      <div class="card">
        <h2>🔎 번호별 상세</h2>
        <div class="row"><button id="btnOpenAll" class="ghost">모두 펼치기</button><button id="btnCloseAll" class="ghost">모두 접기</button></div>
        <div id="perNum" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h2>🛠 도구</h2>
        <label for="undoNum">오늘 뽑기 취소 (실수했을 때, 번호)</label>
        <div class="row"><input id="undoNum" type="number" class="small" min="1"><button id="btnUndo" style="width:auto;white-space:nowrap">취소</button></div>
        <div id="undoMsg" class="msg"></div>
        <label style="margin-top:14px">백업 / 복원</label>
        <textarea id="backup" spellcheck="false"></textarea>
        <div class="row"><button id="btnExport" class="ghost">백업 만들기</button><button id="btnImport" class="ghost">복원하기</button></div>
        <div id="bkMsg" class="msg"></div>
        <button id="btnReset" class="red">🗑 모든 기록 지우기</button>
        <div id="resetMsg" class="msg"></div>
      </div>
      <button class="ghost" data-home>닫기</button>
    </div>
  </div>
</div>

<div id="missionOverlay" class="overlay hidden">
  <div class="ov-in">
    <p class="ov-title">🎯 오늘의 미션!</p>
    <p class="ov-who" id="ovWho"></p>
    <div class="ov-text pop" id="ovText"></div>
    <div class="ov-proof hidden" id="ovProof"></div>
    <div class="ov-snack hidden" id="ovSnack"></div>
    <button id="btnMissionOk">확인했어요!</button>
  </div>
</div>

<script>
(function(){
  var KEY = 'randomFriendDraw.v1';
  // ===== 학급 설정 (여기 값만 바꾸면 돼요) =====
  var CONFIG = {
    total: 25,        // 학생 수 (마지막 번호)
    skip: [10, 14, 22], // 없는 번호
    weekLimit: 5,     // 일주일(월~일) 참여 횟수 (0이면 제한 없음)
    pin: '0000',      // 선생님 비밀번호
    // 보상 간식 목록 (미션에 snack을 따로 지정하면 그 간식이 나와요)
    snacks: ['알맹이 젤리', '에낙', '하리보 사운드 큐브 젤리', '피크닉 젤리', '미니벨', '미니 꽈배기', '뉴트리오코 밀크초콜릿', 'Siip', '참 붕어빵', '쿠키 초코짱'],
    // 미션 목록 (인증이 필요한 미션은 proof: '인증 방법' 을 추가)
    missions: [
      { t: '밸런스 게임' },
      { t: '손가락 텔레파시 5회' },
      { t: '책장 펼치기 숫자' },
      { t: '릴레이 10자 완성하기', proof: '10글자 문장 적어서 검사받기' },
      { t: 'TMI 주고받기', proof: '서로 주고받은 TMI 적어서 검사받기' },
      { t: '마라맛 쫀디기 라티오 나눠먹기', snack: '라티오' },
      { t: '초코하임 나눠 먹기', proof: '서로 좋아하는 과자 이름 적어서 검사받기', snack: '초코하임' },
      { t: '좋아하는 것 싫어하는 것 5가지씩 말하기', proof: '서로 좋아하는 것과 싫어하는 것을 말한 것 중 3가지씩 적어서 검사받기' },
      { t: '초성 이름 n행시 짓기', proof: '서로 초성으로 N행시 만들어서 공유하고 검사받기' },
      { t: '짝꿍 틀린 그림 찾기', proof: '어떤 것들을 서로 찾았는지 말해서 검사받기' },
      { t: '서로의 장점 3가지씩 말하기', proof: '서로의 장점을 말한 것을 종이에 적어서 검사받기' },
      { t: '내 짝꿍을 소개합니다', proof: '설명을 들은 다른 친구가 활동을 제대로 했는지 인증해 주기' },
      { t: '노래 공유', proof: '서로 어떤 노래를 좋아하는지 검사자에게 적어서 검사받기' },
      { t: '블라인드 짝꿍 얼굴 그리기', proof: '서로 얼굴 그린 결과물로 검사받기' },
      { t: '병뚜껑/지우개 핑퐁', proof: '놀이 결과를 보고하여 인증받기' },
      { t: '스무고개', proof: '스무고개 결과를 보고하기' },
      { t: '최애 아이돌/음식/게임 맞추기', proof: '서로 좋아하는 최애 아이돌과 음식, 게임을 적어서 검사받기' },
      { t: '친구랑 책상에서 알까기', proof: '놀이 결과를 보고하기' },
      { t: '짝꿍 프로필 작성', proof: '서로 프로필을 작성해서 보고하기' },
      { t: '양세찬 게임', proof: '게임으로 어떤 단어를 했는지, 결과는 어떤지 보고하기' },
      { t: '청기백기 게임', proof: '놀이 결과를 보고하여 검사받기' }
    ],
    names: {
      1: '김도형', 2: '김사랑', 3: '김윤오', 4: '김진후', 5: '남하연',
      6: '박예서', 7: '박은호', 8: '서지호', 9: '양예원', 11: '우현주',
      12: '유한별', 13: '이루리', 15: '이서우', 16: '임주환', 17: '장효지',
      18: '조연우', 19: '최아임', 20: '최하준', 21: '하히로토', 23: '황다미',
      24: '장지윤', 25: '박선정'
    }
  };
  // ============================================
  var S = load(); applyConfig();
  function applyConfig(){
    S.total = CONFIG.total; S.skip = cleanSkip(CONFIG.skip); S.weekLimit = CONFIG.weekLimit;
    S.pin = String(CONFIG.pin); S.missions = cleanMissions(CONFIG.missions); S.names = cleanNames(CONFIG.names);
    S.snacks = (CONFIG.snacks || []).map(function(x){ return String(x).trim(); }).filter(Boolean);
  }
  var me = null, busy = false, saveWarned = false;

  function $(id){ return document.getElementById(id); }
  function cleanSkip(a){
    var r = [];
    (Array.isArray(a) ? a : []).forEach(function(v){ v = parseInt(v, 10); if(v > 0 && r.indexOf(v) < 0) r.push(v); });
    return r.sort(function(a, b){ return a - b; });
  }
  function cleanNames(o){
    var r = {};
    if(o && typeof o === 'object') for(var k in o){
      var n = parseInt(k, 10), v = String(o[k] || '').trim().slice(0, 10);
      if(n > 0 && v) r[n] = v;
    }
    return r;
  }
  function nm(n){ return S.names && S.names[n] ? ' ' + S.names[n] : ''; }
  function lbl(n){ return n + '번' + nm(n); }
  function escH(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function cleanMissions(a){
    return (Array.isArray(a) ? a : []).map(function(m){
      if(typeof m === 'string') m = { t: m };
      return { t: String((m && m.t) || '').trim(), proof: String((m && m.proof) || '').trim(), snack: String((m && m.snack) || '').trim() };
    }).filter(function(m){ return m.t; });
  }
  function pickMission(){
    if(!S.missions.length) return null;
    var used = (S.picks[me] || []).map(function(p){ return p.mission; });
    var pool = S.missions.filter(function(m){ return used.indexOf(m.t) < 0; });
    if(!pool.length) pool = S.missions;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function randomSnack(){ return S.snacks && S.snacks.length ? S.snacks[Math.floor(Math.random() * S.snacks.length)] : ''; }
  function isActive(i){ return i >= 1 && i <= S.total && S.skip.indexOf(i) < 0; }
  function activeList(){ var l = []; for(var i = 1; i <= S.total; i++) if(isActive(i)) l.push(i); return l; }
  function randActive(){ var l = activeList(); return l.length ? l[Math.floor(Math.random() * l.length)] : '?'; }
  function renderSkipNote(){
    var s = S.skip.filter(function(v){ return v <= S.total; });
    $('skipNote').textContent = s.length ? '※ 없는 번호: ' + s.join(', ') + '번' : '';
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var o = JSON.parse(raw);
        if(o && typeof o === 'object') return { total: +o.total || 25, pin: String(o.pin || '0000'), picks: o.picks || {}, skip: cleanSkip(o.skip), missions: cleanMissions(o.missions), weekLimit: (o.weekLimit === undefined ? 3 : Math.max(0, parseInt(o.weekLimit, 10) || 0)), names: cleanNames(o.names) };
      }
    }catch(e){}
    return { total: 25, pin: '0000', picks: {}, skip: [], missions: [], weekLimit: 3, names: {} };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
    catch(e){ return false; }
  }
  function today(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function mmdd(s){ return s.slice(5).replace('-', '/'); }
  function show(name){
    ['vLogin','vMe','vTeacher','vMissions'].forEach(function(v){ $(v).classList.add('hidden'); });
    $(name).classList.remove('hidden');
  }
  function home(){
    me = null; $('myNum').value = ''; $('loginErr').textContent = ''; renderSkipNote();
    $('tLock').classList.remove('hidden'); $('tOpen').classList.add('hidden'); $('pin').value = '';
    show('vLogin');
  }

  // ---- 규칙: 나 자신 X, 내가 이미 뽑은 친구 X, 나를 뽑은 친구 X ----
  function weekStart(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function weekCount(x){ var ws = weekStart(); return (S.picks[x] || []).filter(function(p){ return p.date >= ws; }).length; }
  function weekFull(x){ return S.weekLimit > 0 && weekCount(x) >= S.weekLimit; }
  function pickedToday(){
    var t = today(), out = [];
    for(var k in S.picks){ (S.picks[k] || []).forEach(function(p){ if(p.date === t) out.push(p.to); }); }
    return out;
  }
  function pickedBy(x){
    var out = [];
    for(var k in S.picks){
      if((S.picks[k] || []).some(function(p){ return p.to === x; })) out.push(+k);
    }
    return out;
  }
  function candidates(x){
    var mine = (S.picks[x] || []).map(function(p){ return p.to; });
    var theirs = pickedBy(x);
    var taken = pickedToday();
    var list = [];
    for(var i = 1; i <= S.total; i++){
      if(isActive(i) && i !== x && mine.indexOf(i) < 0 && theirs.indexOf(i) < 0 && taken.indexOf(i) < 0) list.push(i);
    }
    return list;
  }
  function drewToday(x){
    return (S.picks[x] || []).filter(function(p){ return p.date === today(); })[0] || null;
  }

  // ---- 입장 ----
  function enter(){
    var n = parseInt($('myNum').value, 10);
    if(!n || n < 1 || n > S.total){ $('loginErr').textContent = '1번부터 ' + S.total + '번 사이의 번호를 써 주세요!'; return; }
    if(!isActive(n)){ $('loginErr').textContent = n + '번은 없는 번호예요. 다시 확인해 주세요!'; return; }
    me = n; renderMe(); show('vMe');
  }
  function renderMe(){
    $('hi').textContent = '안녕, ' + lbl(me) + '! 👋';
    var t = drewToday(me), left = candidates(me).length;
    var btn = $('btnDraw');
    $('slot').textContent = t ? t.to : '?';
    $('weekNote').textContent = S.weekLimit > 0 ? '이번 주 참여 ' + weekCount(me) + '/' + S.weekLimit + '회' : '';
    $('friendName').textContent = t && S.names[t.to] ? S.names[t.to] : '';
    var mb = $('mission');
    if(t && (t.mission || t.snack)){
      mb.innerHTML = '<b>🎯 오늘의 미션</b>';
      var sp = document.createElement('span'); sp.textContent = t.mission; mb.appendChild(sp);
      if(t.proof){ var pe = document.createElement('div'); pe.style.marginTop = '8px'; pe.textContent = '📸 인증: ' + t.proof; mb.appendChild(pe); }
      if(t.snack){ var se = document.createElement('div'); se.style.marginTop = '8px'; se.textContent = '🍬 보상 간식: ' + t.snack; mb.appendChild(se); }
      mb.classList.remove('hidden');
    }else mb.classList.add('hidden');
    if(t){
      $('status').textContent = '오늘은 ' + lbl(t.to) + ' 친구를 뽑았어요! 내일 또 만나요 😊';
      btn.disabled = true; btn.textContent = '오늘은 끝!';
    }else if(weekFull(me)){
      $('status').textContent = '이번 주 참여는 모두 끝났어요! 다음 주 월요일에 만나요 😊';
      btn.disabled = true; btn.textContent = '이번 주는 끝!';
    }else if(left === 0){
      $('status').textContent = '지금은 뽑을 수 있는 친구가 없어요. (오늘 이미 뽑힌 친구는 뽑을 수 없어요) 내일 다시 도전하거나 선생님께 알려주세요!';
      btn.disabled = true; btn.textContent = '뽑을 친구 없음';
    }else{
      $('status').textContent = '버튼을 눌러 오늘의 친구를 뽑아요!';
      btn.disabled = false; btn.textContent = '🎁 친구 뽑기!';
    }
    var h = $('history'); h.innerHTML = '';
    var list = S.picks[me] || [];
    if(!list.length){ h.innerHTML = '<span class="msg">아직 뽑은 친구가 없어요.</span>'; }
    list.forEach(function(p){
      var c = document.createElement('span'); c.className = 'chip';
      c.innerHTML = escH(lbl(p.to)) + ' <small>' + mmdd(p.date) + '</small>';
      h.appendChild(c);
    });
  }

  // ---- 뽑기 ----
  function draw(){
    if(busy || drewToday(me) || weekFull(me)) return;
    var c = candidates(me);
    if(!c.length) return;
    var pick = c[Math.floor(Math.random() * c.length)];
    busy = true;
    // 애니메이션 도중 닫아도 다시 뽑지 못하게 바로 기록
    var pm = pickMission();
    (S.picks[me] = S.picks[me] || []).push({ to: pick, date: today(), mission: pm ? pm.t : '', proof: pm ? pm.proof : '', snack: (pm && pm.snack) || randomSnack() });
    if(!save() && !saveWarned){ saveWarned = true; $('status').textContent = '⚠️ 저장이 안 되는 브라우저예요. 선생님께 알려주세요!'; }
    $('btnDraw').disabled = true;
    $('status').textContent = '두근두근…';
    var slot = $('slot'), count = 0;
    var timer = setInterval(function(){
      slot.textContent = randActive();
      if(++count > 22){
        clearInterval(timer);
        slot.textContent = pick;
        slot.classList.remove('pop'); void slot.offsetWidth; slot.classList.add('pop');
        busy = false;
        renderMe();
        $('status').textContent = '🎉 ' + lbl(pick) + ' 친구가 뽑혔어요! 오늘 꼭 말을 걸어 보세요!';
        var rm = drewToday(me);
        if(rm && (rm.mission || rm.snack)) setTimeout(function(){ showMission(pick, rm.mission, rm.proof, rm.snack); }, 900);
      }
    }, 80);
  }

  // ---- 선생님 ----
  function openTeacher(){
    $('undoMsg').textContent = $('bkMsg').textContent = $('resetMsg').textContent = '';
    renderTable();
    $('tLock').classList.add('hidden'); $('tOpen').classList.remove('hidden');
  }
  function renderTable(){
    var t = today(), done = 0, esc = function(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }, html = '<tr><th>번호</th><th>오늘 뽑은 · 뽑힌 기록 · 미션</th></tr>', pending = [];
    for(var i = 1; i <= S.total; i++){
      if(!isActive(i)){ html += '<tr><td>' + i + '</td><td style="color:var(--sub)">🚫 없는 번호</td></tr>'; continue; }
      var list = S.picks[i] || [];
      var tl = list.filter(function(p){ return p.date === t; });
      if(tl.length) done++; else if(!weekFull(i)) pending.push(i);
      var cell = tl.map(function(p){
        return '<div style="margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline"><span>👉 <b>' + escH(lbl(p.to)) + '</b>을 뽑음 <span style="color:var(--sub)">(' + mmdd(p.date) + ')</span></span>' + (p.mission ? '<span>🎯 ' + esc(p.mission) + (p.proof ? ' <small>(📸 ' + esc(p.proof) + ')</small>' : '') + '</span>' : '') + (p.snack ? '<span>🍬 ' + esc(p.snack) + '</span>' : '') + '</div>';
      }).join('');
      for(var k in S.picks){
        (S.picks[k] || []).forEach(function(p){
          if(p.to === i && p.date === t) cell += '<div style="margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline"><span>👈 <b>' + escH(lbl(+k)) + '</b>에게 뽑힘 <span style="color:var(--sub)">(' + mmdd(p.date) + ')</span></span>' + (p.mission ? '<span>🎯 ' + esc(p.mission) + (p.proof ? ' <small>(📸 ' + esc(p.proof) + ')</small>' : '') + '</span>' : '') + (p.snack ? '<span>🍬 ' + esc(p.snack) + '</span>' : '') + '</div>';
        });
      }
      if(!cell) cell = '-';
      html += '<tr><td>' + i + (S.names[i] ? '<br><small>' + escH(S.names[i]) + '</small>' : '') + '</td><td>' + cell + '</td></tr>';
      
    }
    
    
    [].forEach(function(r){
      html += '<tr><td>' + mmdd(r.d) + '</td><td>' + r.from + '번</td><td>' + r.to + '번</td><td>' + (r.m ? esc(r.m) : '<span style="color:var(--sub)">-</span>') + '</td></tr>';
    });
    
    var sk = S.skip.filter(function(v){ return v <= S.total; });
    $('notYet').textContent = (pending.length ? '오늘 아직 못 뽑은 번호: ' + pending.join(', ') : '오늘 모두 뽑았어요! 🎉') + (sk.length ? '  |  없는 번호: ' + sk.join(', ') : '');
    $('tbl').innerHTML = html;
    renderPerNum();
    $('todayCount').textContent = '· 오늘 뽑은 친구 ' + done + '/' + activeList().length;
  }
  function renderPerNum(){
    var box = $('perNum'), openSet = {}, html = '';
    Array.prototype.forEach.call(box.querySelectorAll('details'), function(d){ if(d.open) openSet[d.getAttribute('data-n')] = true; });
    var esc = function(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    for(var i = 1; i <= S.total; i++){
      if(!isActive(i)){ html += '<div class="msg" style="text-align:left">' + i + '번 🚫 없는 번호</div>'; continue; }
      var recs = (S.picks[i] || []).map(function(p){ return { kind: 0, other: p.to, d: p.date, m: p.mission || '', pf: p.proof || '', sn: p.snack || '' }; });
      var a = recs.length, b = 0;
      for(var k in S.picks){
        (S.picks[k] || []).forEach(function(p){ if(p.to === i){ recs.push({ kind: 1, other: +k, d: p.date, m: p.mission || '', pf: p.proof || '', sn: p.snack || '' }); b++; } });
      }
      recs.sort(function(x, y){ return x.d < y.d ? -1 : x.d > y.d ? 1 : x.kind - y.kind; });
      var body = recs.length ? '<table class="tbl"><tr><th>날짜</th><th>구분</th><th>상대</th><th>미션</th></tr>' + recs.map(function(r){
        return '<tr><td>' + mmdd(r.d) + '</td><td>' + (r.kind ? '👈 뽑힘' : '👉 뽑음') + '</td><td><b>' + escH(lbl(r.other)) + '</b></td><td>' + (r.m ? '🎯 ' + esc(r.m) + (r.pf ? '<br><small>📸 인증: ' + esc(r.pf) + '</small>' : '') : '-') + (r.sn ? '<br><small>🍬 보상: ' + esc(r.sn) + '</small>' : '') + '</td></tr>';
      }).join('') + '</table>' : '<div class="msg" style="text-align:left">아직 기록이 없어요.</div>';
      html += '<details class="pn" data-n="' + i + '"' + (openSet[i] ? ' open' : '') + '><summary>' + escH(lbl(i)) + ' <span style="font-weight:400;color:var(--sub);font-size:14px">· 뽑음 ' + a + ' · 뽑힘 ' + b + ' · 이번 주 ' + weekCount(i) + (S.weekLimit ? '/' + S.weekLimit : '') + '회</span></summary>' + body + '</details>';
    }
    box.innerHTML = html;
  }
  var missionBack = 'vLogin';
  function openMissionList(from){
    missionBack = from;
    var box = $('mlList'); box.innerHTML = '';
    $('mlCount').textContent = '친구를 뽑으면 이 중 하나가 랜덤으로 나와요! (총 ' + S.missions.length + '개)';
    S.missions.forEach(function(m, i){
      var d = document.createElement('div'); d.className = 'mi';
      var b = document.createElement('b'); b.textContent = (i + 1) + '. ' + m.t; d.appendChild(b);
      var s = document.createElement('small'); s.textContent = m.proof ? '📸 인증: ' + m.proof : '인증 없음'; d.appendChild(s);
      if(m.snack){ var sn = document.createElement('small'); sn.textContent = '🍬 보상 간식: ' + m.snack; d.appendChild(sn); }
      box.appendChild(d);
    });
    if(!S.missions.length) box.innerHTML = '<div class="msg">아직 미션이 없어요.</div>';
    show('vMissions'); window.scrollTo(0, 0);
  }
  function resetArm(){ $('btnReset').dataset.arm = ''; $('btnReset').textContent = '🗑 모든 기록 지우기'; }

  renderSkipNote();
  function showMission(friend, text, proof, snack){
    $('ovWho').textContent = lbl(friend) + ' 친구와 함께!';
    $('ovText').textContent = text || '친구와 즉거운 이야기를 나눠 보세요!';
    var pf = $('ovProof');
    if(proof){ pf.textContent = '📸 인증: ' + proof; pf.classList.remove('hidden'); } else pf.classList.add('hidden');
    var sk = $('ovSnack');
    if(snack){ sk.textContent = '🍬 보상 간식: ' + snack; sk.classList.remove('hidden'); } else sk.classList.add('hidden');
    var o = $('missionOverlay'); o.classList.remove('hidden'); o.scrollTop = 0;
    var t = $('ovText'); t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
  }
  $('btnMissionOk').onclick = function(){ $('missionOverlay').classList.add('hidden'); };
  // ---- 이벤트 ----
  $('btnEnter').onclick = enter;
  $('myNum').onkeydown = function(e){ if(e.key === 'Enter') enter(); };
  $('btnDraw').onclick = draw;
  $('btnBack').onclick = function(){ if(!busy) home(); };
  $('btnTeacher').onclick = function(){ show('vTeacher'); };
  $('btnMissionList').onclick = function(){ openMissionList('vLogin'); };
  $('btnMissionList2').onclick = function(){ if(!busy) openMissionList('vMe'); };
  $('btnMlBack').onclick = function(){ show(missionBack); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-home]'), function(b){ b.onclick = home; });
  $('btnPin').onclick = function(){
    if($('pin').value === S.pin){ $('pinErr').textContent = ''; openTeacher(); }
    else $('pinErr').textContent = '비밀번호가 달라요.';
  };
  $('pin').onkeydown = function(e){ if(e.key === 'Enter') $('btnPin').click(); };
  $('btnOpenAll').onclick = function(){ Array.prototype.forEach.call($('perNum').querySelectorAll('details'), function(d){ d.open = true; }); };
  $('btnCloseAll').onclick = function(){ Array.prototype.forEach.call($('perNum').querySelectorAll('details'), function(d){ d.open = false; }); };
  $('btnUndo').onclick = function(){
    var n = parseInt($('undoNum').value, 10), list = S.picks[n] || [], t = today();
    var idx = -1;
    list.forEach(function(p, i){ if(p.date === t) idx = i; });
    if(idx < 0){ $('undoMsg').textContent = n + '번은 오늘 뽑은 기록이 없어요.'; return; }
    var removed = list.splice(idx, 1)[0];
    save(); renderTable();
    $('undoMsg').textContent = n + '번의 오늘 기록(' + removed.to + '번)을 취소했어요.';
  };
  $('btnExport').onclick = function(){
    $('backup').value = JSON.stringify({ picks: S.picks });
    $('backup').select();
    $('bkMsg').textContent = '이 글을 복사해서 메모장 등에 보관하세요.';
  };
  $('btnImport').onclick = function(){
    try{
      var o = JSON.parse($('backup').value);
      if(!o || typeof o.picks !== 'object') throw 0;
      S.picks = o.picks; applyConfig();
      save(); openTeacher(); $('bkMsg').textContent = '복원했어요 ✅';
    }catch(e){ $('bkMsg').textContent = '백업 내용이 올바르지 않아요.'; }
  };
  $('btnReset').onclick = function(){
    var b = $('btnReset');
    if(b.dataset.arm !== '1'){
      b.dataset.arm = '1'; b.textContent = '정말 지울까요? 한 번 더 누르면 삭제!';
      setTimeout(resetArm, 4000); return;
    }
    S.picks = {}; save(); resetArm(); renderTable();
    $('resetMsg').textContent = '모든 기록을 지웠어요.';
  };
})();
</script>
</body>
</html>
